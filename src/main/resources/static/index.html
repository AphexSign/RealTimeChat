<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 Real-Time Chat</h1>
            <div class="status" id="status">Offline</div>
        </div>
        
        <div class="auth-section" id="authSection">
            <h2>Login or Register</h2>
            <div id="authError"></div>
            <div>
                <input type="text" id="username" placeholder="Username" />
                <input type="password" id="password" placeholder="Password" />
            </div>
            <div>
                <button id="loginBtn">Login</button>
                <button id="registerBtn">Register</button>
            </div>
        </div>
        
        <div class="chat-section" id="chatSection">
            <div class="messages" id="messages"></div>
            <div class="input-section">
                <input type="text" id="messageInput" placeholder="Type a message..." />
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script src="/js/utils/helpers.js"></script>
    <script src="/js/api/auth.api.js"></script>
    <script src="/js/services/auth.service.js"></script>
    <script src="/js/services/websocket.service.js"></script>
    <script src="/js/components/ui.component.js"></script>
    <script src="/js/components/auth.component.js"></script>
    <script src="/js/components/chat.component.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
